<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>千秋万代 LifeToLine</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-container">
  <nav class="navbar">
    <div class="nav-left">
      <div class="logo">
        <div class="logo-icon">千秋万代</div>
        <span>LifeToLine千秋万代</span>
      </div>
    </div>
    <div class="nav-center">
      <div class="person-selector" style="max-width:320px">
        <input type="text" id="searchPerson" placeholder="搜索人物..." autocomplete="off">
        <div class="autocomplete-list" id="searchAutocomplete"></div>
      </div>
    </div>
    <div class="nav-right">
      <button class="btn" id="customBtn">自定义</button>
      <button class="btn" id="randomBtn">随机探索</button>
      <button class="btn" id="importBtn" title="从 lifedata.js 文件导入数据">导入</button>
      <button class="btn" id="exportBtn" title="导出人物位置和自定义人物到 lifedata.js 文件">导出</button>
      <button class="btn" id="resetBtn" title="恢复 lifedata.js 初始布局与人物（清除缓存与自定义）">重置</button>
      <button class="btn btn-primary" id="shareBtn">分享</button>
    </div>
  </nav>
  <div class="legend-bar">
    <div class="legend-section">
      <span class="legend-title">人物职业</span>
      <div class="legend-items" id="classLegend"></div>
    </div>
    <div class="legend-section">
      <span class="legend-title">关系类型</span>
      <div class="legend-items" id="relationLegend"></div>
    </div>
  </div>
  <div class="timeline-scroll-area" id="timelineScroll">
    <div class="dynasty-bar" id="dynastyBar"></div>
    <div class="timeline-content" id="timelineContent">
      <div class="dynasty-backgrounds" id="dynastyBackgrounds"></div>
      <svg class="connections-svg" id="connectionsSvg"></svg>
      <div class="nodes-container" id="nodesContainer"></div>
    </div>
  </div>
  <div class="detail-overlay" id="detailOverlay"></div>
  <div class="detail-card" id="detailCard">
    <div class="detail-header">
      <div>
        <h2 class="detail-title" id="detailTitle"></h2>
        <div class="detail-subtitle" id="detailSubtitle"></div>
      </div>
      <div class="detail-close" id="detailClose">×</div>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </div>
  <div class="custom-modal-overlay" id="customModalOverlay">
    <div class="custom-modal">
      <h3>添加新人物</h3>
      <div class="form-row">
        <div class="form-group">
          <label>姓名</label>
          <input type="text" id="customName" placeholder="如：张三">
        </div>
        <div class="form-group">
          <label>身份</label>
          <select id="customClass">
            <option value="帝王">帝王</option>
            <option value="贵族">贵族</option>
            <option value="文人">文人</option>
            <option value="武将">武将</option>
            <option value="士">士</option>
            <option value="农">农</option>
            <option value="工">工</option>
            <option value="商">商</option>
            <option value="道">道</option>
            <option value="僧">僧</option>
            <option value="郎中">郎中</option>
            <option value="其它">其它</option>
            <option value="其他">其他</option>
            <option value="皇室">皇室</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>出生年</label>
          <input type="number" id="customBirth" placeholder="如：770">
        </div>
        <div class="form-group">
          <label>去世年</label>
          <input type="number" id="customDeath" placeholder="如：824">
        </div>
      </div>
      <div class="form-group">
        <label>朝代（自动检测）</label>
        <input type="text" id="customDynasty" readonly placeholder="根据生卒年中间值自动判断">
      </div>
      <div class="form-group">
        <label>名言</label>
        <textarea id="customQuote" rows="2" placeholder="如：天下兴亡，匹夫有责。"></textarea>
      </div>
      <div class="form-group">
        <label>出处</label>
        <input type="text" id="customSource" placeholder="如：《日知录》">
      </div>
      <div class="form-group">
        <label>关联人物（至少选择一位，可添加多位）</label>
        <div id="relationList"></div>
        <button type="button" class="btn btn-sm" id="addRelationBtn">+ 添加关联人物</button>
      </div>
      <div class="form-hint">朝代由生卒年中间值所属朝代自动判定，如200-240年取220年对应朝代</div>
      <div class="form-actions">
        <button class="btn" id="customCancel">取消</button>
        <button class="btn btn-primary" id="customSubmit">添加</button>
      </div>
    </div>
  </div>
  <div class="status-bar">
    <div class="mini-timeline">
      <span class="mini-label">时间线</span>
      <div class="mini-track">
        <div class="mini-progress" id="miniProgress"></div>
      </div>
    </div>
    <div class="zoom-info">
      <button class="zoom-btn" id="zoomOut">−</button>
      <span id="zoomLevel">100%</span>
      <button class="zoom-btn" id="zoomIn">+</button>
    </div>
    <input type="range" class="scroll-slider" id="scrollSlider" min="0" max="100" value="0">
    <span class="stats-text" id="statsText"></span>
  </div>
  <footer class="footer"></footer>
</div>
<script src="lifedata.js"></script>
<script src="app.js"></script>
</body>
</html>
